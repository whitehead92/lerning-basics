services:
  server:
    build: web2
    ports:
      - "8000:8000"
    restart: unless-stopped
  nginx:
    build: web
    ports:
      - "8080:80"
  web3-static:
    build:
      context: web3
      target: <STAGE_NAME> # Имя которое ты дал этапу со статикой
    ports:
      - "8081:80"
  web3-app:
    build:
      context: web3
      target: <STAGE_NAME> # Имя которое ты дал этапу с FastAPI приложением
    ports:
      - "8082:8000"

# Для такой реализации придется изменить пару моментов
#   - переписать все ссылки с относительных на полные (через localhost:8081 для стсатики и localhost:8082 для обработчиков)
#   - разрешить CORS запросы в FastAPI, заодно познакомишься с этим концептом
# Как только это будет готово, сделаем нормально через прокси сервер и вернем нормальные ссылки