services:
  server:
    build: web2
    networks:
      - localdocker
  nginx:
    build: web
    networks:
      - localdocker
  web3_static:
    build:
      context: web3
      target: stat
    networks:
      - localdocker
  web3_app:
    build:
      context: web3
      target: app
    networks:
      - localdocker
  proxy_nginx:
    build: proxy
    ports:
      - "80:80"
    environment:
      web_1: "nginx:80"
      web_2: "server:8080"
      web_3: "web3_static:80"
      web_4: "web3_app:8082"
    depends_on:
      - nginx
      - server
      - web3_static
      - web3_app
    restart: unless-stopped
    networks:
      - localdocker
networks:
  localdocker:
    driver: bridge