services:
  server:
    build: web2
    ports:
      - "8000:8000"
    restart: unless-stopped
  nginx:
    build: web
    ports:
      - "8080:80"
  web3_static:
    build:
      context: web3
      target: stat
    ports:
      - "8081:80"
  web3_app:
    build:
      context: web3
      target: app
    ports:
      - "8082:8082"